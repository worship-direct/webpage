<svg class="logo-svg" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="worship.direct - providing tools to spread the word of God">
  <title>worship.direct - providing tools to spread the word of God</title>
  
  <!-- Main title: worship.direct -->
  <text x="300" y="50" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#333">
    worship.direct
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">
    providing tools to spread the word of God
  </text>
  
  <!-- 3D Bible icon at 45 degrees -->
  <g transform="translate(40, 20)">
    <!-- Bible in isometric view (45 degrees) -->
    <!-- Front cover (thick line) -->
    <path d="M 0 20 L 20 10 L 20 40 L 0 50 Z" fill="none" stroke="#666" stroke-width="2"/>
    
    <!-- Top edge showing pages (thin lines) -->
    <!-- <path d="M 0 20 L 20 10 L 35 15 L 15 25 Z" fill="#fff" stroke="#666" stroke-width="0.5"/> -->
    
    <!-- Back cover (thick lines) -->
    <!-- Top edge of back cover -->
    <line x1="20" y1="10" x2="35" y2="15" stroke="#666" stroke-width="2"/>
    <!-- Right edge of back cover -->
    <line x1="35" y1="15" x2="35" y2="45" stroke="#666" stroke-width="2"/>
    <!-- Bottom edge of back cover -->
    <line x1="35" y1="45" x2="20" y2="40" stroke="#666" stroke-width="2"/>
    <!-- Left edge of back cover -->
    <!-- <line x1="20" y1="40" x2="20" y2="10" stroke="#666" stroke-width="2"/> -->
    
    <!-- Spine (thick lines) -->
    <!-- Top edge of spine -->
    <line x1="0" y1="20" x2="15" y2="25" stroke="#666" stroke-width="2"/>
    <!-- Right edge of spine -->
    <!-- reintroduced -->
    <line x1="15" y1="25" x2="15" y2="55" stroke="#666" stroke-width="2"/>
    <!-- Bottom edge of spine -->
    <line x1="15" y1="55" x2="0" y2="50" stroke="#666" stroke-width="2"/>
    <!-- Left edge of spine -->
    <!-- <line x1="0" y1="50" x2="0" y2="20" stroke="#666" stroke-width="2"/> -->
    
    <!-- Page lines (thin lines for depth) - only visible on top edge -->
    <!-- <line x1="20" y1="12" x2="33" y2="16" stroke="#666" stroke-width="0.5"/>
    <line x1="20" y1="14" x2="33" y2="18" stroke="#666" stroke-width="0.5"/>
    <line x1="20" y1="16" x2="33" y2="20" stroke="#666" stroke-width="0.5"/> -->
    
    <!-- Cross on the front cover -->
    <g transform="translate(8, 32)">
      <!-- Vertical part of cross -->
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#666" stroke-width="1.5"/>
      <!-- Horizontal part of cross -->
      <line x1="-3" y1="-1" x2="3" y2="-1" stroke="#666" stroke-width="1.5"/>
    </g>
  </g>
</svg>
