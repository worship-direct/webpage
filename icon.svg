<svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="worship.direct - providing tools to spread the word of God">
  <title>worship.direct - providing tools to spread the word of God</title>
  
  <!-- 3D Bible icon at 45 degrees -->
  <g transform="translate(40, 20)">
    <!-- Back cover (thick lines) -->
    <line x1="13.75" y1="15" x2="28.75" y2="20" stroke="#666" stroke-width="2"/>

    <line x1="28.75" y1="20" x2="28.75" y2="50" stroke="#666" stroke-width="2"/>
    <!-- Bottom edge of front cover-->
    <line x1="28.75" y1="50" x2="23.75" y2="48.5" stroke="#666" stroke-width="2"/>

    <!-- Front Cover -->
  
    <line x1="8.75" y1="20" x2="23.75" y2="25" stroke="#666" stroke-width="2"/>

    <line x1="23.75" y1="25" x2="23.75" y2="55" stroke="#666" stroke-width="2"/>
    <line x1="8.75" y1="20" x2="8.75" y2="50" stroke="#666" stroke-width="1"/>
        <line x1="8.75" y1="20" x2="13.75" y2="15" stroke="#666" stroke-width="1"/>
    <!-- Bottom edge of front cover-->
    <line x1="23.75" y1="55" x2="8.75" y2="50" stroke="#666" stroke-width="2"/>

    <g transform="translate(11.75, 32)">
      <!-- Vertical part of cross -->
      <line x1="4" y1="-3" x2="4" y2="10" stroke="#666" stroke-width="1"/>
      <!-- Horizontal part of cross -->
      <line x1="1" y1="1" x2="7" y2="3" stroke="#666" stroke-width="1"/>
    </g>
  </g>
</svg>
