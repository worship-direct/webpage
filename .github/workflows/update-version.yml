name: Update Version on GitHub Pages Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'screenshots/**'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        run: |
          # Get the total commit count as version number
          VERSION=$(git rev-list --count HEAD)
          # Get current commit SHA (short)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          # Get current date/time
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          echo "Generated version: $VERSION"
          echo "Commit: $COMMIT_SHA"
          echo "Timestamp: $TIMESTAMP"

      - name: Create version.json
        run: |
          # Use jq to create properly escaped JSON
          jq -n \
            --arg version "${{ steps.version.outputs.VERSION }}" \
            --arg commit "${{ steps.version.outputs.COMMIT_SHA }}" \
            --arg timestamp "${{ steps.version.outputs.TIMESTAMP }}" \
            '{version: $version, commit: $commit, timestamp: $timestamp}' \
            > version.json
          cat version.json

      - name: Commit version.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            # Use --force-with-lease to prevent overwriting concurrent changes
            git push --force-with-lease
          fi
