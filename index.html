<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worship Direct – Bible API</title>
  <link rel="preload" href="bible/en/kjv.json" as="fetch" crossorigin="anonymous" />
  <link rel="preload" href="bible/en/asv.json" as="fetch" crossorigin="anonymous" />
  <script src="js/api.js" defer></script>
  <script src="js/router.js" defer></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f9f9f9; }
    label, select, input { display: block; margin: 0.5rem 0; }
    #result { margin-top: 2rem; padding: 1rem; background: #fff; border-radius: 8px; }
    .verse-display { font-size: 1.2rem; line-height: 1.6; }
    .verse-reference { font-weight: bold; margin-top: 1rem; }
    #lookup-form { display: block; }
    
    /* Logo styling */
    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-svg {
      max-width: 600px;
      width: 100%;
      height: auto;
    }
    
    /* GitHub link styling */
    .github-link {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #eaeaea;
    }
    .github-link a {
      display: inline-flex;
      align-items: center;
      color: #333;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .github-link a:hover {
      background-color: #eaeaea;
    }
    .github-link svg {
      margin-right: 8px;
    }
    
    /* Version display styling */
    .version-info {
      text-align: center;
      margin-top: 1rem;
      padding: 0.5rem;
      color: #666;
      font-size: 0.85rem;
    }
    .version-info .version-number {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="logo-container" id="logo-container">
    <!-- Logo loaded from icon.html -->
    <noscript>
      <svg class="logo-svg" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="worship.direct - providing tools to spread the word of God">
        <title>worship.direct - providing tools to spread the word of God</title>
        <text x="300" y="50" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#333">
          worship.direct
        </text>
        <text x="300" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">
          providing tools to spread the word of God
        </text>
        <g transform="translate(40, 30)">
          <path d="M 7 0 L 10 0 L 18 4 L 18 28 L 7 24 L 10 24 L 0 28 Z" fill="none" stroke="#666" stroke-width="1"/>
          <line x1="10" y1="0" x2="10" y2="24" stroke="#666" stroke-width="1"/>
          <line x1="7" y1="0" x2="7" y2="24" stroke="#666" stroke-width="1"/>
        </g>
      </svg>
    </noscript>
  </div>

  <div id="lookup-form">
    <label for="version">Version:</label>
    <select id="version">
      <option value="kjv">KJV</option>
      <option value="asv">ASV</option>
    </select>

    <label for="book">Book:</label>
    <input type="text" id="book" placeholder="e.g., John" />

    <label for="chapter">Chapter:</label>
    <input type="number" id="chapter" placeholder="e.g., 3" />

    <label for="verse">Verse:</label>
    <input type="number" id="verse" placeholder="e.g., 16" />

    <button id="fetch">Get Verse</button>
  </div>

  <div id="result"></div>
  
  <!-- GitHub repository link with logo -->
  <div class="github-link">
    <a href="https://github.com/worship-direct/webpage" target="_blank" rel="noopener noreferrer" title="View source on GitHub">
      <svg height="20" width="20" aria-hidden="true" viewBox="0 0 16 16" version="1.1">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.7-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      <span>View on GitHub</span>
    </a>
  </div>
  
  <!-- Version information -->
  <div class="version-info">
    <span id="version-display">Loading version...</span>
  </div>
  
  <script>
    // Load logo from icon.html
    fetch('icon.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('logo-container').innerHTML = html;
      })
      .catch(error => {
        console.error('Failed to load logo from icon.html:', error);
        // Fallback is already in place via noscript tag
      });
    
    // Fetch and display version information
    fetch('version.json')
      .then(response => {
        if (!response.ok) throw new Error('Failed to fetch version');
        return response.json();
      })
      .then(data => {
        const versionDisplay = document.getElementById('version-display');
        // Clear existing content
        versionDisplay.textContent = '';
        
        // Validate data format to prevent XSS
        const version = String(data.version).replace(/[^0-9]/g, '');
        const commit = String(data.commit).replace(/[^a-f0-9]/g, '').substring(0, 7);
        const timestamp = String(data.timestamp).substring(0, 100); // Limit length
        
        if (!version || !commit || !timestamp) {
          throw new Error('Invalid version data');
        }
        
        // Build version display safely using DOM manipulation
        versionDisplay.appendChild(document.createTextNode('Version '));
        
        const versionSpan = document.createElement('span');
        versionSpan.className = 'version-number';
        versionSpan.textContent = 'v' + version;
        versionDisplay.appendChild(versionSpan);
        
        versionDisplay.appendChild(document.createTextNode(' | Commit ' + commit + ' | ' + timestamp));
      })
      .catch(error => {
        console.error('Error loading version:', error);
        document.getElementById('version-display').textContent = 'Version info unavailable';
      });
  </script>
</body>
</html>
